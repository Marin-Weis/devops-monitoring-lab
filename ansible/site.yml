---
- name: Deploy the lab stack (application + monitoring)
  hosts: lab
  gather_facts: false
  pre_tasks:
    - name: Verify Docker daemon is reachable
      community.docker.docker_host_info:
      register: docker_info
      changed_when: false

    - name: Create the lab Docker network
      community.docker.docker_network:
        name: "{{ lab_network }}"
        state: present

  roles:
    - role: app
      tags: [app]
    - role: monitoring
      tags: [monitoring]

  post_tasks:
    - name: Wait for application health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ app_host_port }}/health"
        status_code: 200
      register: app_health
      retries: 15
      delay: 2
      until: app_health.status == 200
      changed_when: false

    - name: Wait for Prometheus readiness
      ansible.builtin.uri:
        url: "http://localhost:{{ prometheus_host_port }}/-/ready"
        status_code: 200
      register: prom_ready
      retries: 15
      delay: 2
      until: prom_ready.status == 200
      changed_when: false

    - name: Wait for Grafana readiness
      ansible.builtin.uri:
        url: "http://localhost:{{ grafana_host_port }}/api/health"
        status_code: 200
      register: grafana_ready
      retries: 30
      delay: 2
      until: grafana_ready.status == 200
      changed_when: false

    - name: Print lab service URLs
      ansible.builtin.debug:
        msg:
          - "Application : http://localhost:{{ app_host_port }}  (metrics: /metrics)"
          - "Prometheus  : http://localhost:{{ prometheus_host_port }}"
          - "Grafana     : http://localhost:{{ grafana_host_port }}  ({{ grafana_admin_user }} / {{ grafana_admin_password }})"
