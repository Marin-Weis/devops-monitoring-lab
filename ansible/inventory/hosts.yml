---
# Inventaire du lab : un seul hôte (la machine locale), piloté via connexion "local".
# Pour cibler une VM distante, remplacer par ansible_host / ansible_user (SSH).
all:
  children:
    lab:
      hosts:
        lab-local:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
