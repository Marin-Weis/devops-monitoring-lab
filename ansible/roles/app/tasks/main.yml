---
# Role "app": builds the Python service Docker image and runs the container.
- name: Build application Docker image
  community.docker.docker_image:
    name: "{{ app_image }}"
    tag: "{{ app_tag }}"
    source: build
    build:
      path: "{{ app_build_dir }}"
    force_source: false   # only rebuild when build context changes -> idempotent
  notify: Restart application

- name: Run application container
  community.docker.docker_container:
    name: "{{ app_name }}"
    image: "{{ app_image }}:{{ app_tag }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ lab_network }}"
    published_ports:
      - "{{ app_host_port }}:8000"
    env:
      ERROR_RATE: "{{ app_error_rate }}"
