---
# Rôle "app" : construit l'image Docker du service Python et lance le conteneur.
- name: Construire l'image de l'application
  community.docker.docker_image:
    name: "{{ app_image }}"
    tag: "{{ app_tag }}"
    source: build
    build:
      path: "{{ app_build_dir }}"
    force_source: false   # ne rebuild que si le contexte change → idempotent
  notify: Redémarrer l'application

- name: Lancer le conteneur de l'application
  community.docker.docker_container:
    name: "{{ app_name }}"
    image: "{{ app_image }}:{{ app_tag }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ lab_network }}"
    published_ports:
      - "{{ app_host_port }}:8000"
    env:
      ERROR_RATE: "{{ app_error_rate }}"
