---
# Role "monitoring": Prometheus (scraping + alert rules) and Grafana (provisioning as code).
- name: Create configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ lab_dir }}"
    - "{{ lab_dir }}/prometheus"
    - "{{ lab_dir }}/grafana/provisioning/datasources"
    - "{{ lab_dir }}/grafana/provisioning/dashboards"
    - "{{ lab_dir }}/grafana/dashboards"

# ---------- Prometheus ----------
- name: Render Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ lab_dir }}/prometheus/prometheus.yml"
    mode: "0644"
  notify: Restart Prometheus

- name: Render Prometheus alert rules
  ansible.builtin.template:
    src: alert_rules.yml.j2
    dest: "{{ lab_dir }}/prometheus/alert_rules.yml"
    mode: "0644"
  notify: Restart Prometheus

- name: Validate Prometheus configuration with promtool before deployment
  community.docker.docker_container:
    name: "{{ prometheus_name }}-check"
    image: "{{ prometheus_image }}"
    entrypoint: ["promtool", "check", "config", "/etc/prometheus/prometheus.yml"]
    volumes:
      - "{{ lab_dir }}/prometheus:/etc/prometheus:ro"
    detach: false
    cleanup: true
    auto_remove: false
    state: started
  register: monitoring_promtool_result
  changed_when: false
  failed_when: monitoring_promtool_result.status | default(0) != 0

- name: Run Prometheus container
  community.docker.docker_container:
    name: "{{ prometheus_name }}"
    image: "{{ prometheus_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ lab_network }}"
    published_ports:
      - "{{ prometheus_host_port }}:9090"
    volumes:
      - "{{ lab_dir }}/prometheus:/etc/prometheus:ro"
      - "lab-prometheus-data:/prometheus"

# ---------- Grafana ----------
- name: Provision Prometheus datasource
  ansible.builtin.template:
    src: grafana_datasource.yml.j2
    dest: "{{ lab_dir }}/grafana/provisioning/datasources/prometheus.yml"
    mode: "0644"
  notify: Restart Grafana

- name: Provision Grafana dashboard provider
  ansible.builtin.template:
    src: grafana_dashboards.yml.j2
    dest: "{{ lab_dir }}/grafana/provisioning/dashboards/default.yml"
    mode: "0644"
  notify: Restart Grafana

- name: Deploy Grafana dashboard JSON
  ansible.builtin.copy:
    src: dashboards/app-overview.json
    dest: "{{ lab_dir }}/grafana/dashboards/app-overview.json"
    mode: "0644"

- name: Run Grafana container
  community.docker.docker_container:
    name: "{{ grafana_name }}"
    image: "{{ grafana_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ lab_network }}"
    published_ports:
      - "{{ grafana_host_port }}:3000"
    env:
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "{{ grafana_anonymous_access | lower }}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/app-overview.json
    volumes:
      - "{{ lab_dir }}/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "{{ lab_dir }}/grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - "lab-grafana-data:/var/lib/grafana"
