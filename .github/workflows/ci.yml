name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run unit tests
        run: cd app && python -m pytest -q

      - name: Run yamllint
        run: yamllint -c .yamllint.yml ansible

      - name: Run ansible-lint
        run: cd ansible && ansible-lint site.yml

      - name: Verify Grafana dashboard JSON is up to date
        run: |
          python scripts/generate_dashboard.py
          git diff --exit-code ansible/roles/monitoring/files/dashboards/

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - uses: actions/checkout@v4
      - name: Build application Docker image
        run: docker build -t devops-lab/app:ci app

  validate-prometheus:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render Ansible templates and validate with promtool
        run: |
          pip install -r requirements-dev.txt
          python - <<'PY'
          import yaml, pathlib
          from jinja2 import Environment, FileSystemLoader
          vars_ = yaml.safe_load(open("ansible/group_vars/all.yml"))
          env = Environment(loader=FileSystemLoader("ansible/roles/monitoring/templates"))
          out = pathlib.Path("rendered"); out.mkdir()
          for name in ("prometheus.yml", "alert_rules.yml"):
              (out / name).write_text(env.get_template(name + ".j2").render(**vars_))
          PY
          docker run --rm --entrypoint promtool -v "$PWD/rendered:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
